name: Deploy Jay Interiors to GitHub Pages

on:
  # Runs on every push to the main branch
  push:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Grant permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ─── JOB 1: BUILD ────────────────────────────────────────────────────────
  build:
    name: Build Next.js
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js static export
        run: |
          if [ -n "${{ vars.NEXT_PUBLIC_BASE_PATH }}" ]; then
            if [ "${{ vars.NEXT_PUBLIC_BASE_PATH }}" = "/" ] || [ "${{ vars.NEXT_PUBLIC_BASE_PATH }}" = "empty" ]; then
              export NEXT_PUBLIC_BASE_PATH=""
            else
              export NEXT_PUBLIC_BASE_PATH="${{ vars.NEXT_PUBLIC_BASE_PATH }}"
            fi
          else
            REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
            if [ "$REPO_NAME" = "${{ github.repository_owner }}.github.io" ]; then
              export NEXT_PUBLIC_BASE_PATH=""
            else
              export NEXT_PUBLIC_BASE_PATH="/$REPO_NAME"
            fi
          fi
          npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_FIREBASE_DATABASE_URL: ${{ vars.NEXT_PUBLIC_FIREBASE_DATABASE_URL }}
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ vars.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
          NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: ${{ vars.NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET }}
          NEXT_PUBLIC_EMAILJS_SERVICE_ID: ${{ vars.NEXT_PUBLIC_EMAILJS_SERVICE_ID }}
          NEXT_PUBLIC_EMAILJS_TEMPLATE_ID: ${{ vars.NEXT_PUBLIC_EMAILJS_TEMPLATE_ID }}
          NEXT_PUBLIC_EMAILJS_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_EMAILJS_PUBLIC_KEY }}

      - name: Upload build artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          # Next.js static export outputs to /out
          path: ./out

  # ─── JOB 2: DEPLOY ───────────────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build   # Only runs after build succeeds

    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
